<h3>Reihenfolge festlegen</h3>

<div cdkDropList cdkDropListOrientation="mixed" [cdkDropListData]="sortedItems" id="sort-list"
    (cdkDropListDropped)="onDrop($event)" class="drop-zone">

    <div class="drop-placeholder">
        @if (sortedItems.length === 0){
        <span nz-icon nzType="plus-circle" nzTheme="outline"></span>
        <!-- <span nz-icon nzType="inbox" nzTheme="outline"></span> -->
        <p>Hierher ziehen</p>
        }
    </div>

    @for (item of sortedItems; track item.id) {

    <div class="item" cdkDrag (click)="selectItem(item)" [class.selected]="(selectedItem | async)?.id === item.id"
        [style.background]="($safeNavigationMigration(item?.hintergrund) | isColor) ? item?.hintergrund : 'none'"
        (cdkDragStarted)="onDragStarted()" (cdkDragEnded)="onDragEnded()">

        @if (!(item.hintergrund | isColor)) {
        @if (item.mediaType === 'image') {
        <img [src]="item.hintergrund | imageUrl" class="fill" [alt]="`News #${item.id}`">
        }
        @if (item.mediaType === 'pdf') {
        <iframe [src]="item.hintergrund | imageUrl | safeUrl" class="fill"></iframe>
        }
        }

        <div class="message preview-scaled" [innerHTML]="item.text | safeHtml" style="pointer-events: none;"></div>

        <!-- 4. Der Platzhalter (Die "Lücke" beim Verschieben) -->
        <div *cdkDragPlaceholder></div>

    </div>
    }
</div>
