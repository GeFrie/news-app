<nz-upload nzType="drag" [nzMultiple]="false" nzAction="https://www.mocky.io/v2/5cc8019d300000980a055e76"
    (nzChange)="handleChange($event)">
    <p class="ant-upload-drag-icon">
        <nz-icon nzType="inbox" />
    </p>
    <p class="ant-upload-text">
        Eine Datei in diesen Bereich ziehen oder darauf klicken um eine Datei hochzuladen.
    </p>
    <p class="ant-upload-hint">
        Unterstützt das Hochladen einer Datei.
    </p>
</nz-upload>
